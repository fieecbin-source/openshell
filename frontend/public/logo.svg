<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cursor-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas with Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />

  <!-- Inner Subtle Accent Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#prompt-grad)" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.18" />

  <!-- Command Prompt Chevron '>' -->
  <path d="M 148 160 L 256 256 L 148 352" fill="none" stroke="url(#prompt-grad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Terminal Cursor '_' -->
  <path d="M 288 352 L 368 352" fill="none" stroke="url(#cursor-grad)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
</svg>

