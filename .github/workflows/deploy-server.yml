name: Deploy Server (Self-Hosted Sync)

on:
  push:
    branches: [main]
    paths:
      - 'backend/server/**'
      - 'backend/crates/sync-protocol/**'
      - 'backend/crates/sync-client/**'
      - 'backend/crates/core-domain/**'
      - 'backend/crates/vault/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Install the tested server binary on the configured host'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openshell-server-production
  cancel-in-progress: false

jobs:
  build:
    name: Test and build server only
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install server build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Validate server and deployment scripts
        run: |
          bash -n deploy/install-server.sh
          cargo fmt -p openshell-server -- --check
          cargo clippy -p openshell-server --all-targets --locked -- -D warnings
          cargo test -p openshell-server --locked
      - name: Build the Linux x86_64 server
        run: cargo build --release -p openshell-server --locked
      - name: Package only server runtime and systemd files
        run: |
          mkdir -p server-package
          install -m 0755 target/release/openshell-server server-package/openshell-server
          install -m 0755 deploy/install-server.sh server-package/install-server.sh
          install -m 0644 deploy/openshell-server.service server-package/openshell-server.service
          install -m 0644 deploy/systemd.env.example server-package/systemd.env.example
          tar -czf openshell-server-deploy.tar.gz -C server-package .
          sha256sum openshell-server-deploy.tar.gz > openshell-server-deploy.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openshell-server-linux-x86_64
          path: |
            openshell-server-deploy.tar.gz
            openshell-server-deploy.tar.gz.sha256
          if-no-files-found: error

  deploy:
    name: Install server on personal host
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-22.04
    environment: production
    steps:
      # No repository checkout or rsync: this job can upload only the server artifact.
      - uses: actions/download-artifact@v4
        with:
          name: openshell-server-linux-x86_64
      - name: Upload and install the server artifact
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_HOST || secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.DEPLOY_USER || secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.DEPLOY_PORT || secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_PATH || secrets.DEPLOY_DIR || '/opt/openshell' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" || { echo '::error::SERVER_HOST (or DEPLOY_HOST) is missing.'; exit 1; }
          test -n "$SERVER_USER" || { echo '::error::SERVER_USER (or DEPLOY_USER) is missing.'; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo '::error::SERVER_SSH_KEY (or DEPLOY_SSH_KEY) is missing.'; exit 1; }
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo '::error::SERVER_USER must be a Linux username without whitespace.'; exit 1; }
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::SERVER_HOST must be an SSH hostname or IPv4 address, without a scheme, port, path, or whitespace.'; exit 1; }
          [[ "$SERVER_PORT" =~ ^[0-9]+$ ]] || { echo '::error::SERVER_PORT must contain only the SSH port number.'; exit 1; }
          [[ "$DEPLOY_DIR" =~ ^/(opt|srv)/[a-zA-Z0-9/_-]+$ ]] || { echo '::error::DEPLOY_DIR (or DEPLOY_PATH) must be an absolute installation path below /opt or /srv.'; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/openshell_deploy_key
          chmod 0600 ~/.ssh/openshell_deploy_key
          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > ~/.ssh/known_hosts
          fi
          chmod 0600 ~/.ssh/known_hosts
          remote_stage="/tmp/openshell-server-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_args=(-p "$SERVER_PORT" -i ~/.ssh/openshell_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" "mkdir -m 0700 -p $remote_stage"
          scp -P "$SERVER_PORT" -i ~/.ssh/openshell_deploy_key -o StrictHostKeyChecking=yes \
            openshell-server-deploy.tar.gz openshell-server-deploy.tar.gz.sha256 \
            "$SERVER_USER@$SERVER_HOST:$remote_stage/"
          ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" bash -s -- "$remote_stage" "$DEPLOY_DIR" <<'REMOTE'
          set -euo pipefail
          stage_dir="$1"
          deploy_dir="$2"
          cd "$stage_dir"
          sha256sum -c openshell-server-deploy.tar.gz.sha256
          tar -xzf openshell-server-deploy.tar.gz
          if [ "$(id -u)" -eq 0 ]; then
            bash ./install-server.sh "$stage_dir" "$deploy_dir"
          else
            sudo -n bash ./install-server.sh "$stage_dir" "$deploy_dir"
          fi
          REMOTE
