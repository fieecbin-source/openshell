name: Release (Multi-platform Desktop)

# 打 v* tag → 三平台构建 → 规整资产名 → 生成 sha256/元数据 → 草稿 Release（人工编辑后发布）
# 发布后 → 把 latest.json 同步到 updater-meta 分支，供 jsDelivr 备用源使用。
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (must match frontend/package.json version)'
        required: true
        default: 'v1.0.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 默认最小权限：只读。写权限仅由需要的 job 单独申请（见 publish / sync-updater-meta）。
permissions:
  contents: read

jobs:
  verify:
    name: Verify version & changelog
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version consistency (package.json / Cargo.toml / tauri.conf.json)
        run: node scripts/version.mjs --check

      - name: Tag matches version
        run: node scripts/release.mjs check --tag "${{ github.event.inputs.tag_name || github.ref_name }}"

      - name: Validate clean release inputs and bundled resource allowlist
        env:
          OPENSHELL_PRIVATE_MARKERS: ${{ secrets.SYNC_PUBLIC_URL }}
        run: node scripts/check-release-inputs.mjs

      # 发布守卫 1：仓库里一旦混入本地数据库/环境文件，先在这里拦住，
      # 否则它们可能被 frontendDist 或 bundler 一起打进安装包。
      - name: Reject tracked local data / secret files
        shell: bash
        run: |
          found=$(git ls-files | grep -Ei '(^|/)\.env$|\.(db|db-wal|db-shm|sqlite|sqlite3|osvault|pem|key)$' || true)
          if [ -n "$found" ]; then
            echo "::error::仓库中存在不应发布的本地数据/密钥文件："
            echo "$found"
            exit 1
          fi
          echo "ok: no tracked local data or secret files"

  build:
    name: Build (${{ matrix.label }})
    if: github.event_name != 'release'
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # bundles 只保留「能接受预发布版本号」的格式：
          #   - msi(WiX) 要求预发布段全为数字（rc.1 不行）
          #   - rpm 不允许版本号里出现 `-`
          # NSIS / dmg / AppImage / deb 都可以正常打包 prerelease。
          - os: windows-latest
            label: windows-x86_64
            platform: windows
            arch: x86_64
            args: '--target x86_64-pc-windows-msvc'
            bundles: 'nsis'
            rust_targets: ''
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            label: macos-universal
            platform: macos
            arch: universal
            args: '--target universal-apple-darwin'
            bundles: 'app,dmg'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            target: universal-apple-darwin
          - os: ubuntu-22.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
            args: '--target x86_64-unknown-linux-gnu'
            bundles: 'appimage,deb'
            rust_targets: ''
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libudev-dev build-essential curl wget file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @openshell/frontend build

      - name: Validate frontend and appearance regressions
        env:
          OPENSHELL_PRIVATE_MARKERS: ${{ secrets.SYNC_PUBLIC_URL }}
        run: |
          pnpm lint
          pnpm test
          node scripts/check-package.mjs frontend/dist

      - name: Build desktop bundles
        run: pnpm tauri build ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - name: Package Windows portable zip
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p target/portable target/portable-archives
          cp target/x86_64-pc-windows-msvc/release/OpenShell.exe target/portable/OpenShell.exe
          touch target/portable/openshell.portable
          cp THIRD_PARTY_NOTICES.md target/portable/
          powershell -Command "Compress-Archive -Path target/portable/* -DestinationPath target/portable-archives/OpenShell-portable.zip -Force"

      - name: Package macOS portable zip
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p target/portable-archives
          (cd target/universal-apple-darwin/release/bundle/macos && zip -r -y "$GITHUB_WORKSPACE/target/portable-archives/OpenShell-portable.zip" OpenShell.app)

      - name: Build Linux standalone server binary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cargo build --release -p openshell-server --target x86_64-unknown-linux-gnu
          VERSION=$(node scripts/version.mjs --print)
          mkdir -p target/server-pkg/deploy artifacts
          cp target/x86_64-unknown-linux-gnu/release/openshell-server target/server-pkg/
          for file in Caddyfile systemd.env.example README.md .env.example docker-compose.yml compose.image.yml openshell-server.service; do
            install -m 0644 "deploy/$file" target/server-pkg/deploy/
          done
          for file in deploy.sh install-server.sh install-server-image.py; do
            install -m 0755 "deploy/$file" target/server-pkg/deploy/
          done
          cp docs/SYNC.md target/server-pkg/
          tar -czf "artifacts/openshell-server-${VERSION}-linux-x86_64.tar.gz" -C target/server-pkg .
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('frontend/package.json', 'utf8')).version;
          const name = `openshell-server-${version}-linux-x86_64.tar.gz`;
          const path = `artifacts/${name}`;
          writeFileSync('artifacts/assets-server-linux-x86_64.json', JSON.stringify({
            platform: 'linux-server', arch: 'x86_64', version,
            files: [{ name, size: statSync(path).size, sha256: createHash('sha256').update(readFileSync(path)).digest('hex') }],
          }, null, 2));
          NODE

      - name: Normalize asset names
        shell: bash
        run: |
          VERSION=$(node scripts/version.mjs --print)
          node scripts/release.mjs assets \
            --root "target/${{ matrix.target }}/release/bundle,target/portable-archives" \
            --version "$VERSION" \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --out artifacts

      - name: Check release artifacts for local data
        env:
          OPENSHELL_PRIVATE_MARKERS: ${{ secrets.SYNC_PUBLIC_URL }}
        run: node scripts/check-package.mjs artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Draft release
    if: github.event_name != 'release'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate categorized release notes
        shell: bash
        run: |
          VERSION=$(node scripts/version.mjs --print)
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          node scripts/release.mjs notes ${PREV:+--from "$PREV"} --out artifacts/release-notes.md

      # 发布守卫 2：上传前确认产物里只有安装包与清单，任何本地数据库、
      # 环境文件、日志、密钥都不允许出现在 release 资产里。
      - name: Assert artifacts contain no local data
        shell: bash
        run: |
          found=$(find artifacts -maxdepth 1 -type f \
            \( -name '*.db' -o -name '*.db-*' -o -name '*.sqlite*' \
               -o -name '.env*' -o -name '*.osvault' -o -name '*.log' \
               -o -name '*.pem' -o -name '*.key' \) || true)
          if [ -n "$found" ]; then
            echo "::error::发布物中包含本地数据文件，已阻止上传："
            echo "$found"
            exit 1
          fi
          echo "ok: artifacts are clean"

      - name: Generate checksums & manifests
        shell: bash
        run: |
          VERSION=$(node scripts/version.mjs --print)
          node scripts/release.mjs manifest \
            --dir artifacts \
            --version "$VERSION" \
            --tag "${GITHUB_REF_NAME}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: OpenShell ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: artifacts/release-notes.md
          draft: true
          # 含 `-` 的 tag（如 v1.0.2-rc.1）一律标记为预发布：
          # 预发布不会写正式 latest.json（见 sync-updater-meta 的条件）
          prerelease: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-') }}
          # 同名资产已存在时报错而不是静默覆盖：保证每个版本首次构建出的
          # 产物（及其 sha256）永久对应那个 release，重跑不会替换已发布的二进制。
          overwrite_files: false
          files: |
            artifacts/OpenShell-*
            artifacts/openshell-server-*
            artifacts/SHA256SUMS.txt
            artifacts/update-meta.json

      # latest.json 是「正式检测源 / 备用源」用的清单，只随稳定版发布；
      # 预发布附带它会误导用户以为稳定通道已更新。
      - name: Attach latest.json (stable releases only)
        if: ${{ !contains(github.event.inputs.tag_name || github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/latest.json --clobber

      - name: Remind manual editing
        run: |
          echo "::notice ::草稿 Release 已创建。请按 .github/release-template.md 人工校对说明后再点击 Publish。"

  # 预发布（rc/beta）**不**写入正式 latest.json 源，避免污染稳定通道用户的检测源。
  # 测试通道客户端直接读 GitHub 的 prerelease（update-meta.json），不需要这份清单。
  sync-updater-meta:
    name: Sync latest.json to updater-meta branch
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download latest.json from the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p meta
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern 'latest.json' --dir meta --clobber

      - name: Push to updater-meta
        run: |
          git config user.name "openshell-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          # 用独立 worktree 构建只有 latest.json 的孤儿分支，避免动到主工作区
          git worktree add --detach meta-branch HEAD
          cd meta-branch
          git checkout --orphan updater-meta
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p updater
          cp ../meta/latest.json updater/latest.json
          git add updater/latest.json
          git commit -m "chore(updater): sync latest.json for ${{ github.event.release.tag_name }}"
          git push origin updater-meta --force
