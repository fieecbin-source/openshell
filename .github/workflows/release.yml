name: Release (Multi-platform Tauri Client & Updater)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop-client:
    name: Build Client (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            name: 'windows-x86_64'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            name: 'macos-universal'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            name: 'linux-x86_64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @openshell/frontend build

      - name: Build Tauri Desktop Package & Sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          projectPath: './frontend'
          tagName: ${{ github.ref_name || inputs.tag_name }}
          releaseName: 'OpenShell ${{ github.ref_name || inputs.tag_name }}'
          releaseBody: |
            ## OpenShell Desktop Client v1.0.0
            
            跨平台原生 SSH / 终端 / SFTP / 监控客户端（Windows / macOS / Linux）。
            
            ### 安装包资产清单
            - **Windows**: `.msi` (Windows Installer), `.exe` (NSIS Setup)
            - **macOS**: `.dmg` (Universal Binary for Apple Silicon & Intel)
            - **Linux**: `.AppImage` (单可执行文件), `.deb` (Debian / Ubuntu)
            - **Updater**: 包含 `latest.json` 与数字签名的自动更新清单
            
            ### 校验与安全
            所有发布包均通过洁净室架构审计与零明文凭据落盘验证。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
