name: CI (Dev / Pull Request)

on:
  push:
    # 默认分支是 main：不加上它的话，合并到 main 之后不会再跑 CI
    branches: [ dev, main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  # 桌面壳（Tauri）只在 Windows + MSVC 上真正跑得起来：
  # 本机 gnu/llvm-mingw 混用会导致测试二进制加载失败（0xC0000139），
  # 因此这里用官方推荐的 windows-latest + MSVC 作为「desktop 测试」的权威结果。
  desktop-windows:
    name: Desktop Tests (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run Desktop Shell Tests
        # 覆盖 IPC 参数校验、安装前快照、安装前二次 sha256、延迟退出等逻辑
        run: cargo test -p openshell-desktop -p openshell-updater -p openshell-store

      - name: Run Desktop Shell Clippy
        run: cargo clippy -p openshell-desktop --all-targets -- -D warnings

  frontend-ci:
    name: Frontend Typecheck, Tests & Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Version Consistency (three sources)
        run: node scripts/version.mjs --check

      - name: Updater Copy Centralization
        run: node scripts/check-updater-copy.mjs

      - name: Frontend Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter @openshell/frontend typecheck

      - name: Unit Tests
        run: pnpm --filter @openshell/frontend test

      - name: Build Frontend Bundle
        run: pnpm --filter @openshell/frontend build

      - name: Check Build Artifacts (no secrets / stray dirs)
        run: node scripts/check-package.mjs

  docker-build-check:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Server Dockerfile exists
        id: check_file
        run: |
          if [ -f "backend/server/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_file.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container (Dry Run)
        if: steps.check_file.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/server/Dockerfile
          push: false
          tags: openshell-server:ci-check

      - name: Validate personal server Compose configuration
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
