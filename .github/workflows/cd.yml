name: CD (Main Container Deployment)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  pre-deploy-test:
    name: Pre-deployment Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Run Server Tests
        run: cargo test -p openshell-server --workspace

  deploy:
    name: Deploy to Production Server
    environment: production
    needs: pre-deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Deploy Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add remote server host key to known_hosts to prevent MITM prompt
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH Connectivity & Remote Directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/openshell' }}
        run: |
          echo "Testing SSH connection to ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}..."
          ssh -p "${SERVER_PORT}" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${DEPLOY_DIR}/deploy"

      - name: Sync Codebase via Rsync (Single SSH Key)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/openshell' }}
        run: |
          echo "Synchronizing project files to remote server..."
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='target' \
            --exclude='node_modules' \
            --exclude='frontend' \
            --exclude='deploy/.env' \
            --exclude='deploy/backups' \
            -e "ssh -p ${SERVER_PORT} -i ~/.ssh/deploy_key" \
            ./ "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_DIR}/"

      - name: Execute Remote Deployment & Health Verification
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/openshell' }}
        run: |
          echo "Executing deploy.sh on server..."
          ssh -p "${SERVER_PORT}" -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" \
            "bash -c 'cd ${DEPLOY_DIR}/deploy && chmod +x deploy.sh && ./deploy.sh'"
