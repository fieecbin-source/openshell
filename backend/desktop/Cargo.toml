[package]
name = "openshell-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "OpenShell"
path = "src/main.rs"

[lib]
name = "openshell_desktop_lib"
# 只保留 rlib：`staticlib` / `cdylib` 是 Tauri 移动端（iOS/Android）模板留下的产物类型，
# 桌面构建用不到；而 Windows-GNU 工具链链接 cdylib 时会因为需要导出数万个 Rust 符号
# 直接失败（`ld: export ordinal too large`）。如后续要构建移动端，请仅在对应目标下恢复。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openshell-core-domain = { workspace = true }
openshell-store = { workspace = true }
openshell-vault = { workspace = true }
openshell-ssh = { workspace = true }
openshell-app-core = { workspace = true }
openshell-sftp = { workspace = true }
openshell-monitor = { workspace = true }
openshell-forward = { workspace = true }
openshell-importer = { workspace = true }
openshell-sync-protocol = { workspace = true }
openshell-extension-sample = { workspace = true }
openshell-serial = { workspace = true }
openshell-updater = { workspace = true }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
ulid = { workspace = true }
tauri-plugin-single-instance = "2.5.4"
