[package]
name = "openshell-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GitHub Release based updater for the OpenShell desktop client"

[dependencies]
openshell-core-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
semver = "1"
sha2 = "0.10"
pulldown-cmark = "0.13"
ammonia = "4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "gzip",
] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs"] }
