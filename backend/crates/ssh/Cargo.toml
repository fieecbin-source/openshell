[package]
name = "openshell-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openshell-core-domain = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2", "async-trait"] }
rand = { workspace = true }
zeroize = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
